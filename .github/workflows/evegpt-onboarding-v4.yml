name: EveGPT onboarding v4

on:
  push:
    paths:
      - "functions/events/evegpt-onboarding/**"
      - ".github/workflows/evegpt-onboarding-v4.yml"
  pull_request:
    paths:
      - "functions/events/evegpt-onboarding/**"
      - ".github/workflows/evegpt-onboarding-v4.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions/events/evegpt-onboarding
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install test dependency
        run: python -m pip install "pydantic>=2,<3"
      - name: Compile
        run: python -m py_compile evegpt_onboarding_v4.py
      - name: Unit tests
        run: python -m unittest -v test_evegpt_onboarding_v4.py
