name: Validate Chat Files

on:
  push:
    paths:
      - "functions/events/chat-files/**"
      - ".github/workflows/validate-chat-files.yml"
  pull_request:
    paths:
      - "functions/events/chat-files/**"
      - ".github/workflows/validate-chat-files.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: functions/events/chat-files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install "pydantic>=2,<3" starlette httpx pytest
      - run: python -m py_compile chat_files.py tests/seed.py
      - run: node --check tests/e2e.mjs
      - run: python -m pytest -q tests/test_chat_files.py
