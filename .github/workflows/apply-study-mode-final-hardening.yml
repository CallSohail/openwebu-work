name: Apply Study Mode final hardening

on:
  push:
    branches:
      - feature/study-mode-v1.1
    paths:
      - .github/workflows/apply-study-mode-final-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-mode-v1.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python .github/scripts/harden_study_mode_v1_1.py
      - name: Extend regression test
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('functions/filters/study-mode/test_study_mode.py')
          s=p.read_text(encoding='utf-8')
          anchor='''    def test_strict_mode_rejects_compatible_variant(self):\n'''
          test='''    def test_unmarked_quiz_requires_quiz_request_context(self):\n        raw = '{"questions":[{"question":"Q?","options":["A","B"],"answer":"A"}]}'\n        self.assertIsNone(self.f._extract_quiz(raw, allow_unmarked=False))\n        self.assertIsNotNone(self.f._extract_quiz(raw, allow_unmarked=True))\n\n'''
          if 'test_unmarked_quiz_requires_quiz_request_context' not in s:
              if s.count(anchor)!=1: raise SystemExit('Unexpected test anchor')
              s=s.replace(anchor,test+anchor,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m pip install "pydantic>=2,<3"
          python -m py_compile functions/filters/study-mode/study_mode.py functions/filters/study-mode/test_study_mode.py
          python -m unittest functions/filters/study-mode/test_study_mode.py -v
      - name: Remove temporary patch files
        run: |
          rm -f .github/scripts/harden_study_mode_v1_1.py
          rm -f .github/workflows/apply-study-mode-final-hardening.yml
      - name: Commit
        run: |
          git config user.name "Muhammad Sohail"
          git config user.email "soh887045@gmail.com"
          git add -A
          git commit -m "fix: scope compatible quiz recovery to quiz requests"
          git push origin HEAD:feature/study-mode-v1.1
