name: Star History

# Redraws docs/star-history.svg, shown at the end of the README, from the
# repository's own stargazer data. No outside service is involved.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/star_history.py"
      - ".github/workflows/star-history.yml"

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw the chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/star_history.py
      - name: Commit it if it changed
        run: |
          if git diff --quiet -- docs/star-history.svg; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/star-history.svg
          git commit -m "Update star history chart"
          git push
