name: Normalize Study Mode compatibility regexes

on:
  push:
    branches:
      - feature/study-mode-v1.1
    paths:
      - .github/workflows/fix-study-mode-regex.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-mode-v1.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize regexes and extend tests
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('functions/filters/study-mode/study_mode.py')
          s=p.read_text(encoding='utf-8')
          replacements=[
            (r'''raw=re.sub(r"^```(?:json)?\\s*|\\s*```$","",raw.strip(),flags=re.I)''', r'''raw=re.sub(r"^```(?:json)?\s*|\s*```$","",raw.strip(),flags=re.I)'''),
            (r'''fixed=re.sub(r'\\\\(?!["\\\\/bfnrtu])',r'\\\\\\\\',fixed)''', r'''fixed=re.sub(r'\\(?!["\\/bfnrtu])',r'\\\\',fixed)'''),
            (r'''fixed=re.sub(r",\\s*([}\\]])",r"\\1",fixed)''', r'''fixed=re.sub(r",\s*([}\]])",r"\1",fixed)'''),
            (r'''m=re.match(r"^([A-Ea-e1-5])(?:[\\).:\\s]|$)",v)''', r'''m=re.match(r"^([A-Ea-e1-5])(?:[\).:\s]|$)",v)'''),
          ]
          for old,new in replacements:
              if s.count(old)!=1:
                  raise SystemExit(f'Expected one regex match for: {old!r}; got {s.count(old)}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          t=Path('functions/filters/study-mode/test_study_mode.py')
          x=t.read_text(encoding='utf-8')
          anchor='''    def test_strict_mode_rejects_compatible_variant(self):\n'''
          extra='''    def test_compatible_parser_handles_fences_trailing_commas_and_answer_label(self):\n        raw = """<!-- STUDY_MODE_QUIZ_START\n```json\n{\"title\":\"T\",\"topic\":\"X\",\"questions\":[{\"question\":\"Q?\",\"options\":[\"One\",\"Two\"],\"answer\":\"B)\",}],}\n```\nSTUDY_MODE_QUIZ_END -->"""\n        quiz = self.f._extract_quiz(raw)\n        self.assertIsNotNone(quiz)\n        self.assertEqual(quiz[\"questions\"][0][\"correct\"], \"B\")\n\n'''
          if 'test_compatible_parser_handles_fences_trailing_commas_and_answer_label' not in x:
              if x.count(anchor)!=1: raise SystemExit('Unexpected test anchor')
              x=x.replace(anchor,extra+anchor,1)
              t.write_text(x,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m pip install "pydantic>=2,<3"
          python -m py_compile functions/filters/study-mode/study_mode.py functions/filters/study-mode/test_study_mode.py
          python -m unittest functions/filters/study-mode/test_study_mode.py -v
      - name: Remove this temporary workflow
        run: rm -f .github/workflows/fix-study-mode-regex.yml
      - name: Commit
        run: |
          git config user.name "Muhammad Sohail"
          git config user.email "soh887045@gmail.com"
          git add -A
          git commit -m "fix: normalize compatible quiz parser regexes"
          git push origin HEAD:feature/study-mode-v1.1
