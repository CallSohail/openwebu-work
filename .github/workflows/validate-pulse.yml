name: Validate Pulse

on:
  push:
    paths:
      - "apps/pulse/**"
      - ".github/workflows/validate-pulse.yml"
  pull_request:
    paths:
      - "apps/pulse/**"
      - ".github/workflows/validate-pulse.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/pulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "oix>=0.8.0" pytest pytest-asyncio
      - run: python -m py_compile pulse.py
      - run: python -m pytest -q test_pulse.py
