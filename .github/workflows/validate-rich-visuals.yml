name: Validate Rich Visuals

on:
  push:
    paths:
      - "functions/filters/rich-visuals/**"
      - ".github/workflows/validate-rich-visuals.yml"
  pull_request:
    paths:
      - "functions/filters/rich-visuals/**"
      - ".github/workflows/validate-rich-visuals.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: functions/filters/rich-visuals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pydantic>=2,<3" pytest
      - run: python -m py_compile rich_visuals.py tests/seed.py tests/fake_model.py
      - run: node --check tests/e2e.mjs
      - run: python -m pytest -q test_rich_visuals.py
