name: Validate Longshot

on:
  push:
    paths:
      - "apps/longshot/**"
      - ".github/workflows/validate-longshot.yml"
  pull_request:
    paths:
      - "apps/longshot/**"
      - ".github/workflows/validate-longshot.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/longshot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "oix[fastapi]>=0.8.0" "uvicorn[standard]" pytest pytest-asyncio
      - run: python -m py_compile longshot.py
      - run: python -m pytest -q test_longshot.py
