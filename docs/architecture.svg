<rect class="lane" x="28" y="28" width="300" height="688" rx="10"/>
<text class="lanet" x="44" y="54" font-size="15">In the browser</text>
<text class="lanes" x="44" y="73" font-size="12">the Open WebUI page</text>
<rect class="lane" x="364" y="28" width="300" height="688" rx="10"/>
<text class="lanet" x="380" y="54" font-size="15">Open WebUI server</text>
<text class="lanes" x="380" y="73" font-size="12">Python, inside Open WebUI</text>
<rect class="lane" x="700" y="28" width="300" height="688" rx="10"/>
<text class="lanet" x="716" y="54" font-size="15">Outside</text>
<text class="lanes" x="716" y="73" font-size="12">other services</text>
