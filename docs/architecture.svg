<rect class="k-ui-bar" x="52.0" y="116.0" width="5" height="56" rx="2"/>
<text class="t" x="68.0" y="138.0" font-size="14">Chat page</text>
<text class="s" x="68.0" y="158.0" font-size="12">message box, answers, menus</text>
<rect class="k-sandbox" x="52.0" y="204.0" width="252" height="88" rx="8" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect class="k-sandbox-bar" x="52.0" y="204.0" width="5" height="88" rx="2"/>
<text class="t" x="68.0" y="226.0" font-size="14">Rich UI embeds</text>
<text class="s" x="68.0" y="246.0" font-size="12">sandboxed iframes in answers:</text>
<text class="s" x="68.0" y="262.0" font-size="12">Generative UI, Email Composer,</text>
<text class="s" x="68.0" y="278.0" font-size="12">Study Mode quizzes, onboarding</text>
<rect class="k-plugin" x="52.0" y="328.0" width="252" height="152" rx="8" stroke-width="1.5"/>
<rect class="k-plugin-bar" x="52.0" y="328.0" width="5" height="152" rx="2"/>
<text class="t" x="68.0" y="350.0" font-size="14">Browser features</text>
<text class="s" x="68.0" y="370.0" font-size="12">one script from /static/loader.js:</text>
<text class="s" x="68.0" y="386.0" font-size="12">Context (Chat Inspector)</text>
<text class="s" x="68.0" y="402.0" font-size="12">Gallery, Files and Artifacts tabs</text>
<text class="s" x="68.0" y="418.0" font-size="12">Mods and their sandboxes</text>
<text class="s" x="68.0" y="434.0" font-size="12"></text>
<text class="s" x="68.0" y="450.0" font-size="12">they call Open WebUI&#x27;s own API</text>
<text class="s" x="68.0" y="466.0" font-size="12">as the signed-in person</text>
<rect class="k-server" x="388.0" y="116.0" width="252" height="56" rx="8" stroke-width="1.5"/>
<rect class="k-server-bar" x="388.0" y="116.0" width="5" height="56" rx="2"/>
<text class="t" x="404.0" y="138.0" font-size="14">Chat pipeline</text>
<text class="s" x="404.0" y="158.0" font-size="12">builds the request to the model</text>
<rect class="k-plugin" x="388.0" y="204.0" width="252" height="88" rx="8" stroke-width="1.5"/>
<rect class="k-plugin-bar" x="388.0" y="204.0" width="5" height="88" rx="2"/>
<text class="t" x="404.0" y="226.0" font-size="14">Filters</text>
<text class="s" x="404.0" y="246.0" font-size="12">inlet, stream, outlet:</text>
<text class="s" x="404.0" y="262.0" font-size="12">Rich Responses, Rich Visuals,</text>
<text class="s" x="404.0" y="278.0" font-size="12">Study Mode, Artifacts mode</text>
<rect class="k-plugin" x="388.0" y="308.0" width="252" height="88" rx="8" stroke-width="1.5"/>
<rect class="k-plugin-bar" x="388.0" y="308.0" width="5" height="88" rx="2"/>
<text class="t" x="404.0" y="330.0" font-size="14">Tools</text>
<text class="s" x="404.0" y="350.0" font-size="12">called by the model:</text>
<text class="s" x="404.0" y="366.0" font-size="12">Generative UI, Email Composer,</text>
<text class="s" x="404.0" y="382.0" font-size="12">RAGFlow connector</text>
<rect class="k-plugin" x="388.0" y="412.0" width="252" height="88" rx="8" stroke-width="1.5"/>
<rect class="k-plugin-bar" x="388.0" y="412.0" width="5" height="88" rx="2"/>
<text class="t" x="404.0" y="434.0" font-size="14">Event functions</text>
<text class="s" x="404.0" y="454.0" font-size="12">react to sign-ups, logins, saves:</text>
<text class="s" x="404.0" y="470.0" font-size="12">Secure Onboarding, and the</text>
<text class="s" x="404.0" y="486.0" font-size="12">browser features above</text>
<rect class="k-plugin" x="388.0" y="524.0" width="252" height="72" rx="8" stroke-width="1.5"/>
<rect class="k-plugin-bar" x="388.0" y="524.0" width="5" height="72" rx="2"/>
<text class="t" x="404.0" y="546.0" font-size="14">Actions</text>
<text class="s" x="404.0" y="566.0" font-size="12">a button under an answer:</text>
<text class="s" x="404.0" y="582.0" font-size="12">Quick Actions</text>
<rect class="k-ext" x="724.0" y="116.0" width="252" height="56" rx="8" stroke-width="1.5"/>
