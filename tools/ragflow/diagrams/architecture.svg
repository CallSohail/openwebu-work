<title id="t">RAGFlow Advanced Connector: how it works</title><desc id="d">The model calls one of the connector&#x27;s tools. The Tool works out which datasets apply, calls the RAGFlow API with the server&#x27;s key, removes duplicate chunks and returns them formatted with their sources.</desc>
