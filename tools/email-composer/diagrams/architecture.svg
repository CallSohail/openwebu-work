<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1028 594" width="1028" height="594" role="img" aria-labelledby="t d">
<title id="t">Rich Email Composer: how it works</title><desc id="d">The model calls compose_email with a draft. The Tool checks the recipients against the policy and returns an editable card. Edits, formatting and exports happen in the card; Send hands the draft to the person&#x27;s own mail app.</desc>
