<title id="t">Chat Files: how it works</title><desc id="d">The Event function serves the Files script. In the page, the Files tab lists the chat&#x27;s files and the person&#x27;s files from Open WebUI&#x27;s API, previews them, and builds zips in the browser.</desc>
