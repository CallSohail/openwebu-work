<title id="t">Chat Inspector: how it works</title><desc id="d">The Event function serves the Inspector script. Context in the chat&#x27;s menu reads the chat, the model and its tools, splits the prompt into parts, fits them to the token count the model reported, and draws the grid.</desc>
