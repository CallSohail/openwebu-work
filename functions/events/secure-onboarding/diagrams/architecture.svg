<rect class="k-plugin-bar" x="388.0" y="108.0" width="5" height="72" rx="2"/>
<text class="t" x="404.0" y="130.0" font-size="14">Onboarding Event function</text>
<text class="s" x="404.0" y="150.0" font-size="12">filters roles, spawns the work</text>
<text class="s" x="404.0" y="166.0" font-size="12">in the background</text>
<rect class="k-plugin" x="388.0" y="212.0" width="252" height="72" rx="8" stroke-width="1.5"/>
<rect class="k-plugin-bar" x="388.0" y="212.0" width="5" height="72" rx="2"/>
<text class="t" x="404.0" y="234.0" font-size="14">Snapshot</text>
<text class="s" x="404.0" y="254.0" font-size="12">permissions, models, tools, prompts,</text>
<text class="s" x="404.0" y="270.0" font-size="12">knowledge, enabled features</text>
<rect class="k-plugin" x="388.0" y="316.0" width="252" height="72" rx="8" stroke-width="1.5"/>
<rect class="k-plugin-bar" x="388.0" y="316.0" width="5" height="72" rx="2"/>
<text class="t" x="404.0" y="338.0" font-size="14">Render the guide</text>
<text class="s" x="404.0" y="358.0" font-size="12">locale catalogs (en, fr, es, ca),</text>
<text class="s" x="404.0" y="374.0" font-size="12">ASCII-safe Rich UI HTML</text>
<rect class="k-plugin" x="388.0" y="412.0" width="252" height="88" rx="8" stroke-width="1.5"/>
<rect class="k-plugin-bar" x="388.0" y="412.0" width="5" height="88" rx="2"/>
<text class="t" x="404.0" y="434.0" font-size="14">Create or update</text>
<text class="s" x="404.0" y="454.0" font-size="12">only when the snapshot hash</text>
<text class="s" x="404.0" y="470.0" font-size="12">changed; by default a deleted</text>
<text class="s" x="404.0" y="486.0" font-size="12">chat stays deleted</text>
<rect class="k-store" x="388.0" y="524.0" width="252" height="72" rx="8" stroke-width="1.5"/>
<rect class="k-store-bar" x="388.0" y="524.0" width="5" height="72" rx="2"/>
<text class="t" x="404.0" y="546.0" font-size="14">Marker and lock</text>
<text class="s" x="404.0" y="566.0" font-size="12">marker in user settings,</text>
<text class="s" x="404.0" y="582.0" font-size="12">Redis lock across workers</text>
