<text class="s" x="68.0" y="366.0" font-size="12">permissions changed</text>
<rect class="k-server" x="52.0" y="420.0" width="252" height="72" rx="8" stroke-width="1.5"/>
<rect class="k-server-bar" x="52.0" y="420.0" width="5" height="72" rx="2"/>
