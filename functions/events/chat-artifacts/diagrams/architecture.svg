<title id="t">Artifacts: how it works</title><desc id="d">Artifacts mode tells the model when to make an artifact. In the page, the parser finds artifacts in answers, keeps their versions, and opens them in a panel with a viewer per kind; pages and apps run in a sandboxed frame; exports are built in the browser.</desc>
